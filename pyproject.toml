[project]
name = "openchoice"
version = "0.2.0"
description = "CPU-first local decision model with optional GPU offload"
requires-python = ">=3.12,<3.13"
dependencies = [
    "transformers==5.17.0",
    "jinja2==3.1.6",
    "numpy==2.3.5",
    "fastapi==0.141.1",
    "uvicorn==0.53.0",
]

[dependency-groups]
build = ["cmake==4.1.3"]
dev = ["typesafe-sdk==0.6.0", "httpx>=0.28,<1"]
train = [
    "pillow==12.3.0",
    "torch==2.8.0",
    "torchvision==0.23.0",
    "peft==0.21.0",
    "accelerate==1.15.0",
    "bitsandbytes==0.50.2; sys_platform == 'linux'",
    "safetensors>=0.5.3",
]

[tool.uv]
package = false
default-groups = []

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
